x-app-env: &app-env
  DATABASE_URL: postgresql://paper_reviewer:paper_reviewer@db:5432/paper_reviewer
  PREFECT_API_URL: http://prefect-server:4200/api

services:
  workspace:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      <<: *app-env
    healthcheck:
      test: ["CMD", "uv", "--version"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # App runtimes (Streamlit UI, Postgres, Prefect, …). Enabled with --profile app
  # (see just up) so sandbox stays workspace-only.
  db:
    profiles: ["app"]
    image: postgres:16
    environment:
      POSTGRES_USER: paper_reviewer
      POSTGRES_PASSWORD: paper_reviewer
      POSTGRES_DB: paper_reviewer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_reviewer -d paper_reviewer"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: apply Alembic migrations before UI (and other app services) start.
  migrate:
    profiles: ["app"]
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  ui:
    profiles: ["app"]
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8501:8501"
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      [
        "uv",
        "run",
        "streamlit",
        "run",
        "src/paper_reviewer/ui/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  # Prefect API + UI (local SQLite under /root/.prefect; not the app Postgres).
  prefect-server:
    profiles: ["app"]
    image: prefecthq/prefect:3.8-python3.12
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_UI_API_URL: http://localhost:4200/api
    volumes:
      - prefect_data:/root/.prefect
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Process worker: same app image as ui/workspace; polls work pool local-pool.
  prefect-worker:
    profiles: ["app"]
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      prefect-server:
        condition: service_healthy
    command:
      [
        "uv",
        "run",
        "prefect",
        "worker",
        "start",
        "--pool",
        "local-pool",
        "--type",
        "process",
      ]
    restart: on-failure

volumes:
  postgres_data:
  prefect_data:

services:
  workspace:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql://paper_reviewer:paper_reviewer@db:5432/paper_reviewer
    healthcheck:
      test: ["CMD", "uv", "--version"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # App runtimes (Streamlit UI, Postgres, …). Enabled with --profile app
  # (see just up) so sandbox stays workspace-only.
  db:
    profiles: ["app"]
    image: postgres:16
    environment:
      POSTGRES_USER: paper_reviewer
      POSTGRES_PASSWORD: paper_reviewer
      POSTGRES_DB: paper_reviewer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_reviewer -d paper_reviewer"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ui:
    profiles: ["app"]
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://paper_reviewer:paper_reviewer@db:5432/paper_reviewer
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "uv",
        "run",
        "streamlit",
        "run",
        "src/paper_reviewer/ui/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  postgres_data:

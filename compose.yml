x-db-env: &db-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://paper_reviewer:paper_reviewer@db:5432/paper_reviewer}

x-app-env: &app-env
  <<: *db-env
  PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}

x-ncbi-env: &ncbi-env
  NCBI_API_KEY: ${NCBI_API_KEY:-}

# Empty OPENAI_BASE_URL is safe: clients pass an explicit public URL when unset
# (OpenAI SDK otherwise treats env "" as a broken base_url).
x-llm-env: &llm-env
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_GATEWAY_MAX_TOKENS: ${OPENAI_GATEWAY_MAX_TOKENS:-}

x-worker-env: &worker-env
  <<: [*app-env, *ncbi-env, *llm-env]

services:
  workspace:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      <<: *app-env
      # justfile detects this instead of /.dockerenv (Windows host just).
      PAPER_REVIEWER_IN_CONTAINER: "1"
    healthcheck:
      test: ["CMD", "uv", "--version"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # App runtimes (Streamlit UI, Postgres, Prefect, …). Enabled with --profile app
  # (see just up) so sandbox stays workspace-only.
  db:
    profiles: ["app"]
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paper_reviewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paper_reviewer}
      POSTGRES_DB: ${POSTGRES_DB:-paper_reviewer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ui:
    profiles: ["app"]
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      <<: [*app-env, *ncbi-env]
    depends_on:
      db:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    command:
      [
        "sh",
        "-lc",
        "/workspace/scripts/migrate.sh && uv run streamlit run src/paper_reviewer/ui/app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true",
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  prefect-server:
    profiles: ["app"]
    image: prefecthq/prefect:3.8-python3.12
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      # Browser on the host must call localhost (not the Compose service name).
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://localhost:4200/api}
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:4200/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  prefect-worker:
    profiles: ["app"]
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      <<: *worker-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    command:
      [
        "sh",
        "-lc",
        "/workspace/scripts/migrate.sh && uv run python -m paper_reviewer.flows.serve",
      ]
    restart: on-failure

  # Local LLM inference runtime (OpenAI-compatible API on host port 11434).
  ollama:
    profiles: ["app"]
    image: ollama/ollama:latest
    container_name: ollama-runtime
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Unload after idle. -1 keeps the model in VRAM forever.
      - OLLAMA_KEEP_ALIVE=5m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    # ─── OPTIONAL: NVIDIA GPU ACCELERATION ───
    # comment this deploy section if your GPU is not NVIDIA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot: pull local chat models into Ollama (idempotent).
  ollama-pull:
    profiles: ["app"]
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull gemma4:e4b"]
    restart: "no"

  # Jupyter Lab for local offline eval notebooks. Profile `notebooks` so
  # `just up` and `just sandbox` do not start it or publish JUPYTER_PORT.
  notebooks:
    profiles: ["notebooks"]
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      <<: *worker-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    command:
      [
        "uv",
        "run",
        "jupyter",
        "lab",
        "--ip=0.0.0.0",
        "--port=8888",
        "--no-browser",
        "--allow-root",
        "--ServerApp.token=",
        "--ServerApp.password=",
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  postgres_data:
  prefect_data:
  ollama_data:
[project]
name = "paper-reviewer"
version = "0.1.0"
description = "Assistant to explore biomedical and life sciences topics via related papers"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "dlt[hub]",
    "en-core-sci-sm",
    "fastmcp>=3.4.6",
    "prefect>=3.8.2",
    "psycopg[binary]>=3.3.4",
    "pydantic",
    "scispacy>=0.6.2",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "pytest",
    "responses>=0.26.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-sci-sm = { url = "https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_sm-0.5.4.tar.gz" }

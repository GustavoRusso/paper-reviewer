[project]
name = "paper-reviewer"
version = "0.1.0"
description = "Assistant to explore biomedical and life sciences topics via related papers"
requires-python = ">=3.12"
dependencies = [
    "dlt[hub]",
    "fastmcp>=3.4.6",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

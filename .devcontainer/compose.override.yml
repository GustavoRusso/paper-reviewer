# Dev Container override: same Compose project as `just sandbox` (paper-reviewer-sandbox).
# Workspace only. App services keep the `app` profile so Reopen in Container does not
# start the product stack. Product UI is a separate host `just up` (paper-reviewer).
# Do not run host `just sandbox` / `just sandbox-down` while the IDE is attached
# (same project; those recipes can recreate or remove the attached container).
name: paper-reviewer-sandbox

services:
  workspace:
    # Keep the long-lived sleep from the Dockerfile; Dev Containers attach here.
    command: ["sleep", "infinity"]
